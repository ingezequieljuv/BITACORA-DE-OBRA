<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de Obra · Registros</title>
<meta name="description" content="Supervisión Ampliación Armería – Manzanillo · JUVISA. Todos los registros de la bitácora, con fotos originales para descargar por rango de fechas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bitácora de Obra · Todos los registros">
<meta property="og:description" content="Supervisión Ampliación Armería – Manzanillo · Ver registros y descargar fotos originales por fechas">
<meta property="og:image" content="https://ingezequieljuv.github.io/BITACORA-DE-OBRA/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#2b3136">
<link rel="icon" href="icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hoja de registro de solo lectura — franja de encabezado, ficha de datos, galería de fotos descargables */
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1c2226; --muted:#5d676c; --line:#d9ddd8;
  --accent:#f2b705; --accent-ink:#1c2226; --asphalt:#2b3136; --ok:#2f7d4f; --bad:#b3362c; --chip:#eceee9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b; --paper:#1d2327; --ink:#e8ebe7; --muted:#9aa4a8; --line:#323a3f;
  --accent:#f5c22b; --accent-ink:#14181b; --asphalt:#0d1012; --ok:#5bbf84; --bad:#ef7a6f; --chip:#262d31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --paper:#1d2327; --ink:#e8ebe7; --muted:#9aa4a8; --line:#323a3f;
  --accent:#f5c22b; --accent-ink:#14181b; --asphalt:#0d1012; --ok:#5bbf84; --bad:#ef7a6f; --chip:#262d31; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--asphalt)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--asphalt);color:#f3f4f1;border-bottom:4px solid var(--accent)}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.logo{height:46px;width:auto;background:#fff;border-radius:6px;padding:3px 5px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.hsub{flex-basis:100%;display:flex;flex-direction:column;gap:2px}
.proy{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.sup{font-family:var(--f-mono);font-size:.72rem;color:#c9cfcb}
main.wrap{padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.ro{font:.72rem var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.card h2{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.date{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.meta{font:.82rem var(--f-mono);color:var(--muted)}
.obra{font-weight:600;font-size:1.05rem;margin-top:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
.kv div{min-width:0}
.kv dt{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.y{color:var(--ok);font-weight:600} td.n{color:var(--bad);font-weight:600}
.notes{white-space:pre-wrap}
.btn{font:600 .95rem var(--f-body);border-radius:6px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:.82rem}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .img{aspect-ratio:4/3;max-width:100%;border-radius:6px;overflow:hidden;background:var(--chip);display:grid;place-items:center;color:var(--muted);font:.75rem var(--f-mono)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.ph .size{font:.7rem var(--f-mono);color:var(--muted)}
.state{text-align:center;color:var(--muted);padding:48px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.filters input,.filters select{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;min-width:0}
.dl{display:flex;flex-direction:column;gap:10px}
.dl h2{margin:0}
.dl .meta:empty{display:none}
.dl-out{display:flex;flex-direction:column;gap:8px}
.dl-out:empty{display:none}
.hint{margin:0;font-size:.85rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.day{font-family:var(--f-display);font-size:1.2rem;letter-spacing:.03em;text-transform:uppercase;margin:10px 0 0}
.item{display:flex;flex-direction:column;gap:3px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:12px 14px;color:var(--ink);text-decoration:none}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.it-top,.it-bot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.it-t{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.go{font-weight:600;font-size:.88rem}
footer{font:.72rem var(--f-mono);color:var(--muted);text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
  <img class="logo" src="logo-juvisa.jpg" alt="JUVISA Ingeniería SA de CV">
  <h1>Bitácora de Obra</h1>
  <div class="hsub"><span class="proy">Supervisión Ampliación Armería – Manzanillo</span><span class="sup" id="sup">JUVISA</span></div>
</div></header>

<main class="wrap" id="main">
  <div class="state" id="state">Cargando bitácora…</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const REPO="ingezequieljuv/BITACORA-DE-OBRA",BRANCH="registros";
const BASE=`https://raw.githubusercontent.com/${REPO}/${BRANCH}/`;
const TIPOS={concreto:"Colado de concreto",asfalto:"Mezcla asfáltica",terraceria:"Terracerías",general:"Supervisión general"};
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-");return`${+d} ${M[+m-1]} ${y}`};
const dia=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return DIAS[new Date(y,m-1,d).getDay()]};
const mb=b=>(b/1048576).toFixed(b<10485760?1:0)+" MB";
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000)}
const isPhone=/iPhone|iPad|iPod|Android/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const BATCH=20;
let idx=null,run=0,ready=[],zipBlob=null;

function inRange(){const d1=$("fDesde").value,d2=$("fHasta").value,t=$("fTipo").value,q=$("fQ").value.toLowerCase().trim();
 return idx.registros.filter(r=>(!d1||r.f_fecha>=d1)&&(!d2||r.f_fecha<=d2)&&(!t||r.tipo===t)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
function render(){run++;ready=[];zipBlob=null;$("dlOut").innerHTML="";
 const list=inRange(),nf=list.reduce((s,r)=>s+(r.fotos||0),0);
 $("sum").textContent=`${list.length} registro${list.length===1?"":"s"} · ${nf} foto${nf===1?"":"s"}`;
 $("dlBtn").disabled=!nf;$("dlBtn").textContent=nf?`Descargar las ${nf} fotos de este rango`:"No hay fotos en este rango";$("dlProg").textContent="";
 if(!list.length){$("list").innerHTML=`<div class="state">No hay registros con estos filtros.</div>`;return}
 let html="",last="";
 for(const r of list.slice().reverse()){if(r.f_fecha!==last){last=r.f_fecha;html+=`<h3 class="day">${esc(r.f_dia||dia(r.f_fecha))} ${esc(fmt(r.f_fecha))}</h3>`}
  const cc=[r.f_cad1?"Km "+r.f_cad1+(r.f_cad2?" – "+r.f_cad2:""):"",r.f_cuerpo,r.f_carril?"Carril "+r.f_carril:""].filter(Boolean).join(" · ");
  html+=`<a class="item" href="ver.html#${encodeURIComponent(r.id)}"><div class="it-top"><span class="it-t">${esc(TIPOS[r.tipo]||"")}</span><span class="meta">${esc(r.f_hora||"")}</span></div>
   <div class="obra">${esc(r.f_obra||"Sin obra")}</div>${cc?`<div class="meta">${esc(cc)}</div>`:""}${r.f_ubic?`<div class="meta">${esc(r.f_ubic)}</div>`:""}
   <div class="it-bot"><span class="meta">📷 ${r.fotos||0} foto${r.fotos===1?"":"s"}</span><span class="go">Ver registro →</span></div></a>`}
 $("list").innerHTML=html}

async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}}))}
async function prepare(){const my=++run;ready=[];zipBlob=null;$("dlOut").innerHTML="";const list=inRange();$("dlBtn").disabled=true;
 $("dlProg").textContent="Buscando fotos…";const fotos=[];
 await pool(list,4,async r=>{try{const res=await fetch(BASE+"r/"+r.id+"/registro.json?t="+Date.now(),{cache:"no-store"});if(!res.ok)return;const d=await res.json();
  (d.fotos||[]).forEach(f=>fotos.push({id:r.id,file:f.file,name:`${r.f_fecha||"sin-fecha"}_${(r.f_hora||"").replace(":","")}_${f.file}`}))}catch(e){}});
 if(my!==run)return;fotos.sort((a,b)=>a.name.localeCompare(b.name));
 let done=0,bytes=0;const out=new Array(fotos.length);
 await pool(fotos,3,async(f,k)=>{if(my!==run)return;try{const res=await fetch(BASE+"r/"+f.id+"/"+encodeURIComponent(f.file));if(!res.ok)throw 0;const b=await res.blob();
  out[k]=new File([b],f.name,{type:b.type&&b.type!=="application/octet-stream"?b.type:(/\.png$/i.test(f.name)?"image/png":"image/jpeg")});bytes+=b.size}catch(e){}
  done++;if(my===run)$("dlProg").textContent=`Descargando ${done} de ${fotos.length} · ${mb(bytes)}`});
 if(my!==run)return;ready=out.filter(Boolean);$("dlBtn").disabled=false;
 if(!ready.length){$("dlProg").textContent="No se pudieron descargar las fotos. Revisa tu señal.";return}
 $("dlProg").textContent=`✓ ${ready.length} fotos listas · ${mb(bytes)} · calidad original`;
 const canShare=isPhone&&navigator.canShare&&navigator.canShare({files:ready.slice(0,1)});
 let h="";
 if(canShare){const n=Math.ceil(ready.length/BATCH);
  h+=`<p class="hint">${n>1?`Tu teléfono guarda las fotos en ${n} grupos. Toca cada botón y elige <b>Guardar imágenes</b>.`:`Toca el botón y elige <b>Guardar imágenes</b>.`}</p>`;
  for(let i=0;i<n;i++){const a=i*BATCH+1,b=Math.min((i+1)*BATCH,ready.length);h+=`<button class="btn pri" data-batch="${i}">Guardar fotos ${a}–${b}</button>`}}
 h+=`<button class="btn${canShare?"":" pri"}" id="zipBtn">${canShare?"O descargar todo en un ZIP":"Descargar todo en un ZIP"}</button>`;
 $("dlOut").innerHTML=h}
async function saveBatch(i,btn){const files=ready.slice(i*BATCH,(i+1)*BATCH);
 try{await navigator.share({files});btn.textContent="✓ "+btn.textContent.replace(/^✓ /,"");btn.classList.remove("pri")}catch(e){if(!(e&&e.name==="AbortError"))toast("No se pudo abrir el menú para guardar")}}
function crc32(u){let c,t=crc32.t;if(!t){t=crc32.t=new Uint32Array(256);for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function makeZip(files){const enc=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
 for(const f of files){const data=new Uint8Array(await f.arrayBuffer()),name=enc.encode(f.name),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
  central.push(c.buffer,name);off+=30+name.length+data.length}
 const csz=central.reduce((s,p)=>s+(p.byteLength||p.length),0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,e.buffer],{type:"application/zip"})}
async function saveZip(btn){const d1=$("fDesde").value,d2=$("fHasta").value;const name=`fotos_bitacora_${d1||"inicio"}_a_${d2||"hoy"}.zip`;
 if(!zipBlob){btn.disabled=true;btn.textContent="Armando ZIP…";zipBlob=await makeZip(ready);btn.disabled=false;btn.textContent="Descargar ZIP ("+mb(zipBlob.size)+")";return}
 const file=new File([zipBlob],name,{type:"application/zip"});
 if(isPhone&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e&&e.name==="AbortError")return}}
 const u=URL.createObjectURL(zipBlob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),120000);toast("ZIP descargado")}

async function main(){const pid=(location.hash||"").replace(/^#/,"").replace(/[^\w-]/g,"");
 if(!pid){$("state").textContent="Este link no está completo. Pide a quien te lo mandó que lo comparta de nuevo.";return}
 try{const r=await fetch(BASE+"indices/"+pid+".json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw r.status;idx=await r.json()}
 catch(e){$("state").textContent="No se encontró la bitácora. Puede que el link ya no esté activo, o si te lo acaban de mandar, espera un minuto y vuelve a abrirlo.";return}
 if(idx.nombre)$("sup").textContent=idx.nombre;
 const fechas=idx.registros.map(r=>r.f_fecha).filter(Boolean).sort(),first=fechas[0]||"",lastd=fechas[fechas.length-1]||"";
 const nf=idx.registros.reduce((s,r)=>s+(r.fotos||0),0);
 $("main").innerHTML=`
  <p class="ro">🔒 Solo lectura · actualizada ${esc(fmt((idx.actualizado||"").slice(0,10)))}</p>
  <section class="card">
   <div class="date">${idx.registros.length} registros</div>
   <div class="meta">${first?`Del ${esc(fmt(first))} al ${esc(fmt(lastd))}`:""} · ${nf} fotos</div>
  </section>
  <section class="card">
   <h2>Elige las fechas</h2>
   <div class="filters">
    <label>Desde<input type="date" id="fDesde" min="${first}" max="${lastd}" value="${first}"></label>
    <label>Hasta<input type="date" id="fHasta" min="${first}" max="${lastd}" value="${lastd}"></label>
    <label>Actividad<select id="fTipo"><option value="">Todas</option>${Object.keys(TIPOS).map(k=>`<option value="${k}">${TIPOS[k]}</option>`).join("")}</select></label>
    <label>Buscar<input id="fQ" placeholder="Obra, km, ubicación…"></label>
   </div>
   <p class="meta" id="sum" style="margin:10px 0 0"></p>
  </section>
  <section class="card dl">
   <h2>Fotos originales</h2>
   <button class="btn pri" id="dlBtn">Descargar fotos</button>
   <p class="meta" id="dlProg"></p>
   <div class="dl-out" id="dlOut"></div>
  </section>
  <section class="list" id="list"></section>
  <footer>Supervisión Ampliación Armería – Manzanillo · JUVISA</footer>`;
 ["fDesde","fHasta","fTipo"].forEach(id=>$(id).addEventListener("change",render));$("fQ").addEventListener("input",render);
 $("dlBtn").onclick=prepare;render()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-batch]");if(b)saveBatch(+b.dataset.batch,b);const z=e.target.closest("#zipBtn");if(z)saveZip(z)});
window.addEventListener("hashchange",()=>location.reload());
main();
})();
</script>
</body>
</html>
